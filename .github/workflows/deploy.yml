# Builds the web version with Godot and publishes it to GitHub Pages on every push to main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Godot + its web templates (~1.3 GB download), kept in a cache after the first run
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot/templates
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # Only the web templates are needed
          unzip -q -j templates.tpz 'templates/web*' 'templates/version.txt' -d ~/godot/templates

      - name: Export web build
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn ~/godot/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p build/web
          touch build/.gdignore   # keep Godot from importing its own output
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
